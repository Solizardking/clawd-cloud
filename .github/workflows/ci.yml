name: CI

on:
  push:
    branches: [main, newnew]
  pull_request:
    branches: [main, newnew]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Clawd Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-structure.mjs
      - run: node scripts/secret-scan.mjs
      - run: npm run test:core
      - run: npm run stack:doctor

  clawd-mcp:
    name: Test clawd-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clawd-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
