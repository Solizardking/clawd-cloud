name: Bug
description: Something in Core AI is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - clawd-core
        - clawd-code
        - clawd-mcp
        - clawd-plugin
        - clawd-skills
        - clawd-connectors
        - clawd-router
        - clawd-wallet
        - clawd-tui
        - clawd-agents
        - clawd-character
        - clawd-goals
        - constitution
        - knowledge
        - mcp-server
        - tailclawd
        - v3
        - zk-primitives
        - scripts
        - other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, logs, and expected vs actual. Redact secrets.
    validations:
      required: true
