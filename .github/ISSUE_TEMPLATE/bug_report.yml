name: Bug report
description: Something in Clawd Cloud is broken
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Trading stays paper by default. Do not paste keypairs, `.env`, or live signatures.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - clawd-code
        - clawd-mcp / plugin
        - clawd-connectors
        - clawd-wallet / router
        - clawd-perps-agent
        - ./claw / v3 / catalog
        - docs / README
        - other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: Expected vs actual. Include the command you ran.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      placeholder: npm run stack:doctor / ./claw cloud / clawd --plugin-dir ./clawd-plugin
    validations:
      required: true
